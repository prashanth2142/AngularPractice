<form class="example-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">
  
    <mat-form-field class="example-full-width">
      <mat-label>Company (disabled)</mat-label>
      <input matInput value="Google" disabled>
    </mat-form-field>
  
    <table class="example-full-width" cellspacing="0">
      <tr>
        <td>
          <mat-form-field class="example-full-width">
            <mat-label>First name</mat-label>
            <input matInput formControlName="firstName">
            <mat-error *ngIf="firstNameCheck?.invalid && firstNameCheck?.touched">First name is required</mat-error>
          </mat-form-field>
        </td>
        <td>
          <mat-form-field class="example-full-width">
            <mat-label>Long Last Name That Will Be Truncated</mat-label>
            <input matInput formControlName="lastName">
            <mat-error *ngIf="lastName?.invalid && lastName?.touched">Last name is required</mat-error>
          </mat-form-field>
        </td>
      </tr>
    </table>
  
    <p>
      <mat-form-field class="example-full-width">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address"></textarea>
        <mat-error *ngIf="address?.invalid && address?.touched">Address is required</mat-error>
      </mat-form-field>
      <mat-form-field class="example-full-width">
        <mat-label>Address 2</mat-label>
        <textarea matInput formControlName="address2"></textarea>
      </mat-form-field>
    </p>
  
    <table class="example-full-width" cellspacing="0">
      <tr>
        <td>
          <mat-form-field class="example-full-width">
            <mat-label>City</mat-label>
            <input matInput formControlName="city">
            <mat-error *ngIf="city?.invalid && city?.touched">City is required</mat-error>
          </mat-form-field>
        </td>
        <td>
          <mat-form-field class="example-full-width">
            <mat-label>State</mat-label>
            <input matInput formControlName="state">
            <mat-error *ngIf="state?.invalid && state?.touched">State is required</mat-error>
          </mat-form-field>
        </td>
        <td>
          <mat-form-field class="example-full-width">
            <mat-label>Postal Code</mat-label>
            <input matInput formControlName="postalCode" maxlength="5">
            <mat-hint align="end">{{ postalCode?.value?.length || 0 }} / 5</mat-hint>
            <mat-error *ngIf="postalCode?.invalid && postalCode?.touched">
              Postal code is required and must be 5 digits
            </mat-error>
          </mat-form-field>
        </td>
      </tr>
    </table>
  
    <button mat-button type="submit" [disabled]="userForm.invalid">Submit</button>
    
  
  </form>
