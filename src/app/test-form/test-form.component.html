<div class="form-container">
  <form [formGroup]="myForm">
    <div class="form-group">
      <label for="textInput">Text Input:</label>
      <input 
        type="text" 
        id="textInput" 
        formControlName="textInput" 
        placeholder="Enter some text"
        class="form-control">
      <div *ngIf="myForm.get('textInput')?.invalid && myForm.get('textInput')?.touched" 
           class="error-message">
        Text input is required
      </div>
    </div>

    <div class="form-group">
      <label for="fileInput">File Input:</label>
      <input 
        type="file" 
        id="fileInput" 
        formControlName="fileInput"
        (change)="onFileSelect($event)"
        class="form-control">
    </div>
  </form>

  <!-- Button outside the form -->
  <div class="button-container">
    <button 
      type="button" 
      (click)="getFormValues()" 
      class="btn btn-primary">
      Get Form Values
    </button>
  </div>

  <!-- Display current form values (optional) -->
  <div class="form-debug" *ngIf="myForm.value">
    <h4>Current Form Values:</h4>
    <pre>{{ myForm.value  }}</pre>
    <p><strong>Form Valid:</strong> {{ myForm.valid }}</p>
  </div>
</div>
